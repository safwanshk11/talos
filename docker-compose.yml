services:
  postgres:
    image: postgres:16-alpine
    container_name: talos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talos_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-talos_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talos} -d ${POSTGRES_DB:-talos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talos-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-TALOS}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-talos-super-secret-key-change-in-production-32-chars-minimum}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-talos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-talos_secret_pass}
      - POSTGRES_DB=${POSTGRES_DB:-talos_db}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3000/auth/github/callback}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - AI_MODEL=${AI_MODEL:-qwen2.5:7b}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-180}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - TALOS_WORKSPACE_ROOT=/tmp/talos_workspaces
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - MONITORING_SCHEDULER_INTERVAL_MINUTES=${MONITORING_SCHEDULER_INTERVAL_MINUTES:-15}
      - MONITORING_SCHEDULER_ENABLED=${MONITORING_SCHEDULER_ENABLED:-true}
      - WORKSPACE_RETENTION_HOURS=${WORKSPACE_RETENTION_HOURS:-24}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      # Docker-outside-of-Docker: lets the backend launch isolated, ephemeral
      # sandbox containers for Phase 4 verification via the host's own Docker
      # engine. The backend container never runs untrusted repo code itself.
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volume (not a bind mount) so patch workspaces are visible by the
      # same path inside both the backend container and the sandbox containers
      # it launches — bind-mounting a backend-container-local path wouldn't
      # resolve on the host, since docker-outside-of-docker mounts are resolved
      # against the host filesystem, not the caller container's.
      - talos_workspaces:/tmp/talos_workspaces
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talos-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  # Fixed (non-project-prefixed) name: the backend mounts this volume at
  # /tmp/talos_workspaces for itself, and SandboxService references this exact
  # same volume name when launching verification containers. Compose normally
  # prefixes volume names with the project name (e.g. talos_talos_workspaces),
  # which would silently break that reference, so it's pinned here.
  talos_workspaces:
    name: talos_workspaces
